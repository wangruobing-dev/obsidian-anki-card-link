name: GitHub release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            word-export-runtime.cjs
            manifest.json
            styles.css
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            word-export-runtime.cjs
            manifest.json
            styles.css
            versions.json
            assets/anki/anki-card-link-note-types.apkg
          generate_release_notes: true
